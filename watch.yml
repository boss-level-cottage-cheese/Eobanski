name: studio-watcher

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "5 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.schedule }}" = "5 8 * * 1" ]; then
            python watcher.py --digest
          else
            python watcher.py
          fi
      - name: Save results
        run: |
          git config user.name "studio-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Update listings"
            git push
          fi
